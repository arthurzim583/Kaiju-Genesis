```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Godzilla MUGEN Fullscreen</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
display:block;
width:100vw;
height:100vh;
}

</style>

</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);


//================ IMAGENS =================

const images={

godzilla:"https://i.ibb.co/sJKWB7qr/deemr2m-4196b7ea-9fb3-4ef0-861c-1580b4681274.png",

godzillaAttack:"https://i.ibb.co/bg9MbBVV/godzilla-atack.png",

ghidorah:"https://i.ibb.co/WWFHQ0Wy/0bbe3f8605c85c5a108089bd72998d00-removebg-preview.png",

ghidorahAttack:"https://i.ibb.co/cXw0GgPV/Design-sem-nome-7-removebg-preview.png",

background:"https://i.ibb.co/8yc7TdR/godzilla-anatomy-scene-super-Jumbo.jpg"

};

const img={};
const scale={};

Object.keys(images).forEach(key=>{

img[key]=new Image();

img[key].onload=function(){

if(key==="background")
return;


// AQUI FOI ALTERADO

let targetHeight;

if(key.includes("godzilla")){

targetHeight=canvas.height*0.38;

}else{

targetHeight=canvas.height*0.55;

}

scale[key]={

width:
this.width*
(targetHeight/this.height),

height:
targetHeight

};

};

img[key].src=images[key];

});




//================ LUTADOR =================

class Fighter{

constructor(x,isGodzilla){

this.x=x;
this.y=canvas.height-300;

this.velX=0;
this.velY=0;

this.health=100;

this.isGodzilla=isGodzilla;

this.facingRight=isGodzilla;

this.attacking=false;

this.attackCooldown=0;

}


update(){

this.x+=this.velX;
this.y+=this.velY;

this.velY+=1;


const ground=
canvas.height-200;


if(this.y>ground){

this.y=ground;
this.velY=0;

}


if(this.x<0)
this.x=0;

if(this.x>canvas.width-300)
this.x=canvas.width-300;


if(this.attackCooldown>0)
this.attackCooldown--;


if(this.attackCooldown<12)
this.attacking=false;

}



draw(){

const key=

this.attacking
?
(this.isGodzilla
?
"godzillaAttack"
:
"ghidorahAttack")
:
(this.isGodzilla
?
"godzilla"
:
"ghidorah");


const currentImg=img[key];
const size=scale[key];

if(!size)return;


ctx.save();

if(!this.facingRight){

ctx.scale(-1,1);

ctx.drawImage(

currentImg,
-this.x-size.width,
this.y-size.height+70,
size.width,
size.height

);

}else{

ctx.drawImage(

currentImg,
this.x,
this.y-size.height+70,
size.width,
size.height

);

}

ctx.restore();

}

}


const godzilla=
new Fighter(
100,
true
);

const ghidorah=
new Fighter(
canvas.width-600,
false
);



//================ TECLAS =================

const keys={};

addEventListener(
"keydown",
e=>keys[e.key]=true
);

addEventListener(
"keyup",
e=>keys[e.key]=false
);



//================ LOOP =================

function gameLoop(){

ctx.drawImage(
img.background,
0,
0,
canvas.width,
canvas.height
);


// GODZILLA

godzilla.velX=0;

if(keys["a"]||keys["A"]){

godzilla.velX=-10;
godzilla.facingRight=false;

}

if(keys["d"]||keys["D"]){

godzilla.velX=10;
godzilla.facingRight=true;

}

if(
(keys["w"]||keys["W"])
&&
godzilla.velY===0
){

godzilla.velY=-22;

}

if(
(keys["f"]||keys["F"])
&&
godzilla.attackCooldown<=0
){

godzilla.attacking=true;
godzilla.attackCooldown=30;

}



// GHIDORAH

ghidorah.velX=0;

if(keys["ArrowLeft"]){

ghidorah.velX=-10;
ghidorah.facingRight=false;

}

if(keys["ArrowRight"]){

ghidorah.velX=10;
ghidorah.facingRight=true;

}

if(
keys["ArrowUp"]
&&
ghidorah.velY===0
){

ghidorah.velY=-22;

}

if(
keys["Enter"]
&&
ghidorah.attackCooldown<=0
){

ghidorah.attacking=true;
ghidorah.attackCooldown=30;

}



// dano

if(
godzilla.attacking &&
Math.abs(
godzilla.x-ghidorah.x
)<300
){

ghidorah.health=
Math.max(
0,
ghidorah.health-2
);

}


if(
ghidorah.attacking &&
Math.abs(
godzilla.x-ghidorah.x
)<350
){

godzilla.health=
Math.max(
0,
godzilla.health-2
);

}



godzilla.update();
ghidorah.update();

godzilla.draw();
ghidorah.draw();



// HUD

ctx.fillStyle="#222";

ctx.fillRect(
50,30,
canvas.width*0.35,
30
);

ctx.fillRect(
canvas.width*0.60,
30,
canvas.width*0.35,
30
);

ctx.fillStyle="#00ff00";

ctx.fillRect(
50,
30,
(canvas.width*0.35)*(godzilla.health/100),
30
);


ctx.fillStyle="#ffff00";

const enemyWidth=
(canvas.width*0.35)
*(ghidorah.health/100);

ctx.fillRect(
canvas.width*0.95-enemyWidth,
30,
enemyWidth,
30
);

ctx.strokeStyle="white";

ctx.strokeRect(
50,30,
canvas.width*0.35,
30
);

ctx.strokeRect(
canvas.width*0.60,
30,
canvas.width*0.35,
30
);

requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
