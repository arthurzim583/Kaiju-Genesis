<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Godzilla MUGEN Fullscreen</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
display:block;
width:100vw;
height:100vh;
}

</style>

</head>

<body>

<canvas id="game"></canvas>

<!-- MÚSICA DE FUNDO - Troque o link do src para mudar a música -->
<audio id="bgMusic" loop autoplay>
<source src="https://nu.vgmtreasurechest.com/soundtracks/scoobydoo-creepy-run-online-gamerip-2013/ntgpgtngaj/02.%20Bonus%20-%20Usher%20Scooby%20Doo%20Party%20Break%20%28Full%29.mp3" type="audio/mpeg">
</audio>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);


//================ IMAGENS =================

const images={

godzilla:"https://i.ibb.co/sJKWB7qr/deemr2m-4196b7ea-9fb3-4ef0-861c-1580b4681274.png",

// ATAQUES GODZILLA - Substitua os links pelas suas imagens
godzillaAttack1:"https://i.ibb.co/bg9MbBVV/godzilla-atack.png", // Ataque leve
godzillaAttack2:"https://i.ibb.co/39GGvdsb/9f3d12b7cab4c1b3bafaf540a0ed6d37.jpg", // Ataque pesado
godzillaAttack3:"https://i.ibb.co/mV6pcPRV/Adobe-Express-file.png", // Ataque especial

ghidorah:"https://i.ibb.co/WWFHQ0Wy/0bbe3f8605c85c5a108089bd72998d00-removebg-preview.png",

// ATAQUES GHIDORAH - Substitua os links pelas suas imagens
ghidorahAttack1:"https://i.ibb.co/cXw0GgPV/Design-sem-nome-7-removebg-preview.png", // Ataque leve
ghidorahAttack2:"COLE_AQUI_O_LINK_DA_IMAGEM_DO_ATAQUE2_GHIDORAH.png", // Ataque pesado
ghidorahAttack3:"COLE_AQUI_O_LINK_DA_IMAGEM_DO_ATAQUE3_GHIDORAH.png", // Ataque especial

background:"https://i.ibb.co/8yc7TdR/godzilla-anatomy-scene-super-Jumbo.jpg"

};

const img={};
const scale={};

Object.keys(images).forEach(key=>{

img[key]=new Image();

img[key].onload=function(){

if(key==="background")
return;


let targetHeight;

if(key.includes("godzilla")){

targetHeight=canvas.height*0.38;

}else{

targetHeight=canvas.height*0.55;

}

scale[key]={

width:
this.width*
(targetHeight/this.height),

height:
targetHeight

};

};
img[key].src=images[key];

});




//================ LUTADOR =================

class Fighter{

constructor(x,isGodzilla){

this.x=x;
this.y=canvas.height-300;

this.velX=0;
this.velY=0;

this.health=100;

this.isGodzilla=isGodzilla;

this.facingRight=isGodzilla;

this.attacking=false;
this.currentAttack=0; // 0=nenhum, 1=leve, 2=pesado, 3=especial

this.attackCooldown=0;
this.attackDamage=0;
this.attackRange=0;

}


update(){

this.x+=this.velX;
this.y+=this.velY;

this.velY+=1;


const ground=
canvas.height-200;


if(this.y>ground){

this.y=ground;
this.velY=0;

}


if(this.x<0)
this.x=0;

if(this.x>canvas.width-300)
this.x=canvas.width-300;


if(this.attackCooldown>0)
this.attackCooldown--;


if(this.attackCooldown<12)
this.attacking=false;

}



draw(){

let key;

if(this.attacking){
if(this.isGodzilla){
if(this.currentAttack===1) key="godzillaAttack1";
else if(this.currentAttack===2) key="godzillaAttack2";
else if(this.currentAttack===3) key="godzillaAttack3";
}else{
if(this.currentAttack===1) key="ghidorahAttack1";
else if(this.currentAttack===2) key="ghidorahAttack2";
else if(this.currentAttack===3) key="ghidorahAttack3";
}
}else{
key=this.isGodzilla?"godzilla":"ghidorah";
}


const currentImg=img[key];
const size=scale[key];

if(!size)return;


ctx.save();

if(!this.facingRight){

ctx.scale(-1,1);

ctx.drawImage(

currentImg,
-this.x-size.width,
this.y-size.height+70,
size.width,
size.height

);

}else{

ctx.drawImage(

currentImg,
this.x,
this.y-size.height+70,
size.width,
size.height

);

}
ctx.restore();

}

}


const godzilla=
new Fighter(
100,
true
);

const ghidorah=
new Fighter(
canvas.width-600,
false
);



//================ TECLAS =================

const keys={};

addEventListener(
"keydown",
e=>keys[e.key]=true
);

addEventListener(
"keyup",
e=>keys[e.key]=false
);



//================ LOOP =================

function gameLoop(){

ctx.drawImage(
img.background,
0,
0,
canvas.width,
canvas.height
);


// GODZILLA

godzilla.velX=0;

if(keys["a"]||keys["A"]){

godzilla.velX=-10;
godzilla.facingRight=false;

}

if(keys["d"]||keys["D"]){

godzilla.velX=10;
godzilla.facingRight=true;

}

if(
(keys["w"]||keys["W"])
&&
godzilla.velY===0
){

godzilla.velY=-22;

}

// ATAQUES GODZILLA
// F = Ataque leve (dano: 1, alcance: 300)
if(
(keys["f"]||keys["F"])
&&
godzilla.attackCooldown<=0
){

godzilla.attacking=true;
godzilla.currentAttack=1;
godzilla.attackCooldown=30;
godzilla.attackDamage=1;
godzilla.attackRange=300;

}

// G = Ataque pesado (dano: 1.5, alcance: 320)
if(
(keys["g"]||keys["G"])
&&
godzilla.attackCooldown<=0
){

godzilla.attacking=true;
godzilla.currentAttack=2;
godzilla.attackCooldown=45;
godzilla.attackDamage=1.5;
godzilla.attackRange=320;

}

// H = Ataque especial (dano: 2, alcance: 400)
if(
(keys["h"]||keys["H"])
&&
godzilla.attackCooldown<=0
){

godzilla.attacking=true;
godzilla.currentAttack=3;
godzilla.attackCooldown=60;
godzilla.attackDamage=2;
godzilla.attackRange=400;

}



// GHIDORAH

ghidorah.velX=0;

if(keys["ArrowLeft"]){

ghidorah.velX=-10;
ghidorah.facingRight=false;

}

if(keys["ArrowRight"]){

ghidorah.velX=10;
ghidorah.facingRight=true;

}

if(
keys["ArrowUp"]
&&
ghidorah.velY===0
){

ghidorah.velY=-22;

}

// ATAQUES GHIDORAH
// Enter = Ataque leve (dano: 1, alcance: 320)
if(
keys["Enter"]
&&
ghidorah.attackCooldown<=0
){

ghidorah.attacking=true;
ghidorah.currentAttack=1;
ghidorah.attackCooldown=30;
ghidorah.attackDamage=1;
ghidorah.attackRange=320;

}

// Shift = Ataque pesado (dano: 1.5, alcance: 340)
if(
keys["Shift"]
&&
ghidorah.attackCooldown<=0
){

ghidorah.attacking=true;
ghidorah.currentAttack=2;
ghidorah.attackCooldown=45;
ghidorah.attackDamage=1.5;
ghidorah.attackRange=340;

}

// Ctrl = Ataque especial (dano: 2, alcance: 420)
if(
keys["Control"]
&&
ghidorah.attackCooldown<=0
){

ghidorah.attacking=true;
ghidorah.currentAttack=3;
ghidorah.attackCooldown=60;
ghidorah.attackDamage=2;
ghidorah.attackRange=420;

}



// dano

if(
godzilla.attacking &&
Math.abs(
godzilla.x-ghidorah.x
)<godzilla.attackRange
){

ghidorah.health=
Math.max(
0,
ghidorah.health-godzilla.attackDamage
);

}


if(
ghidorah.attacking &&
Math.abs(
godzilla.x-ghidorah.x
)<ghidorah.attackRange
){

godzilla.health=
Math.max(
0,
godzilla.health-ghidorah.attackDamage
);

}



godzilla.update();
ghidorah.update();

godzilla.draw();
ghidorah.draw();



// HUD

ctx.fillStyle="#222";

ctx.fillRect(
50,30,
canvas.width*0.35,
30
);

ctx.fillRect(
canvas.width*0.60,
30,
canvas.width*0.35,
30
);

ctx.fillStyle="#00ff00";

ctx.fillRect(
50,
30,
(canvas.width*0.35)*(godzilla.health/100),
30
);


ctx.fillStyle="#ffff00";

const enemyWidth=
(canvas.width*0.35)
*(ghidorah.health/100);

ctx.fillRect(
canvas.width*0.95-enemyWidth,
30,
enemyWidth,
30
);

ctx.strokeStyle="white";

ctx.strokeRect(
50,30,
canvas.width*0.35,
30
);

ctx.strokeRect(
canvas.width*0.60,
30,
canvas.width*0.35,
30
);

// CONTROLES
ctx.fillStyle="white";
ctx.font="16px Arial";
ctx.fillText("GODZILLA: A/D (mover) | W (pular) | F (leve) | G (pesado) | H (especial)", 50, canvas.height-50);
ctx.fillText("GHIDORAH: ←/→ (mover) | ↑ (pular) | Enter (leve) | Shift (pesado) | Ctrl (especial)", 50, canvas.height-30);

requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
